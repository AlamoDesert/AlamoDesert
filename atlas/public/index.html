<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Karten</title>
<meta name="description" content="Freie Live-Daten auf einer Karte: Flugzeuge, Erdbeben und mehr – ohne Konto, ohne Paywall.">
<meta name="theme-color" content="#11151c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<style>
  :root {
    --bg: #f4f5f7; --panel: rgba(255,255,255,.94); --text: #14181f; --muted: #5d6573; --line: rgba(20,24,31,.12);
    --accent: #1c64d9; --err: #c92a2a; --hint: #b25e09; --shadow: 0 6px 24px rgba(0,0,0,.16);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --panel: rgba(26,31,40,.94); --text: #eef1f5; --muted: #9aa3b2; --line: rgba(255,255,255,.12);
      --accent: #5b9bff; --err: #ff8787; --hint: #ffb057; --shadow: 0 6px 24px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  #map { position: fixed; inset: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

  #top { position: fixed; z-index: 3; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: 8px; align-items: flex-start; max-width: calc(100vw - 24px); }
  #layerbtn { display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 12px; font: inherit; color: inherit; cursor: pointer; }
  #layerbtn b { font-size: 16px; letter-spacing: -.01em; }
  #layerbtn .dot { width: 10px; height: 10px; border-radius: 50%; background: #2f9e44; box-shadow: 0 0 0 3px rgba(47,158,68,.2); }
  #layerbtn.warn .dot { background: var(--err); box-shadow: 0 0 0 3px rgba(201,42,42,.2); }
  #layerbtn .chev { color: var(--muted); transition: transform .15s; }
  #layerbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  #panel { width: 300px; max-width: 100%; padding: 6px; }
  .layer { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; cursor: pointer; }
  .layer:hover { background: var(--line); }
  .layer input { position: absolute; opacity: 0; pointer-events: none; }
  .layer .sw { flex: 0 0 auto; width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; transition: background .15s; }
  .layer .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .layer input:checked + .sw { background: var(--accent); }
  .layer input:checked + .sw::after { transform: translateX(16px); }
  .layer input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
  .layer .txt { display: flex; flex-direction: column; min-width: 0; }
  .layer small { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .layer small.err { color: var(--err); } .layer small.hint { color: var(--hint); }

  #detail { position: fixed; z-index: 4; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
    width: 320px; max-width: calc(100vw - 24px); padding: 14px 16px 16px; }
  @media (max-width: 640px) {
    #detail { top: auto; left: 12px; right: 12px; width: auto; bottom: max(12px, env(safe-area-inset-bottom)); }
  }
  #detail header { display: grid; grid-template-columns: 1fr auto; align-items: start; margin-bottom: 8px; }
  #detail .kind { grid-column: 1; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  #detail h2 { grid-column: 1; margin: 2px 0 0; font-size: 19px; letter-spacing: -.01em; }
  #detail .close { grid-column: 2; grid-row: 1 / span 2; border: 0; background: var(--line); color: inherit; width: 30px; height: 30px;
    border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
  #detail dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 12px; font-size: 14px; }
  #detail dt { color: var(--muted); } #detail dd { margin: 0; font-variant-numeric: tabular-nums; }
  #detail .cam { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: var(--line); margin: 0 0 10px; }
  #detail .noimg { margin: 0 0 10px; padding: 24px 12px; text-align: center; border-radius: 10px; background: var(--line); color: var(--muted); font-size: 14px; }
  #detail .links { display: flex; gap: 16px; flex-wrap: wrap; }
  #detail .ext { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }

  /* Oben statt unten: unten liegen Detailkarte (mobil), Zoom und Quellennachweis. */
  #toast { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: max(68px, calc(env(safe-area-inset-top) + 56px));
    padding: 10px 14px; font-size: 14px; max-width: calc(100vw - 32px); }
  [hidden] { display: none !important; }

  .maplibregl-ctrl-group, .maplibregl-ctrl-attrib { background: var(--panel) !important; color: var(--text); }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib-inner { color: var(--muted); }
  .maplibregl-ctrl-attrib a { color: var(--text); }
  .maplibregl-ctrl-scale { background: var(--panel); color: var(--text); border-color: var(--muted); }
  @media (prefers-color-scheme: dark) { .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); } }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Karte"></div>
<div id="top">
  <button id="layerbtn" class="card" aria-expanded="true" aria-controls="panel">
    <span class="dot" aria-hidden="true"></span><b>Live Karten</b><span class="chev" aria-hidden="true">▾</span>
  </button>
  <div id="panel" class="card" role="group" aria-label="Ebenen"><div id="layers"></div></div>
</div>
<section id="detail" class="card" hidden aria-live="polite"></section>
<div id="toast" class="card" role="status" hidden></div>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
