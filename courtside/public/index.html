}

}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --sheet: #1C1C1E;
  --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36); --thumb: #636366;
  --fg: #FFFFFF; --fg-2: rgba(235, 235, 245, .62); --fg-3: rgba(235, 235, 245, .32); --sep: rgba(84, 84, 88, .6);
  --accent: #0A84FF; --on-accent: #FFFFFF; --accent-soft: rgba(10, 132, 255, .22); --on-accent-soft: #64B0FF;
  --sec-soft: rgba(118, 118, 128, .28); --on-sec-soft: #F2F2F7;

  --gold: #FFD60A; --silver: #C7CDD3; --bronze: #E09A5C;

:root[data-theme="dark"][data-platform="android"] {
  --bg: #111318; --surface: #1D2024; --surface-2: #282A2F; --sheet: #191C20;

  --fg: #E2E2E9; --fg-2: #C4C6D0; --fg-3: #8E9099; --sep: #44474E;

  --glass: #1D2024; --glass-edge: transparent; --scrim: rgba(0, 0, 0, .5);
  --inverse: #E2E2E9; --on-inverse: #2E3036;
  --gold: #F0C24B; --silver: #BFC8D2; --bronze: #F2A66F;
  --court-padel: #224680; --court-pickleball: #1F5340; --court-tennis: #7C3920;

/* ---------- Typo & Maße je Plattform ---------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font-num: "SF Pro Rounded", ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --fs-large: 34px; --fs-title: 22px; --fs-head: 17px; --fs-body: 17px; --fs-sub: 15px; --fs-foot: 13px; --fs-cap: 12px; --fs-tab: 10px;
  --fw-strong: 600; --fw-bold: 700;
  --r-card: 22px; --r-inner: 14px; --r-field: 12px;
  --cell-h: 50px; --bar-h: 52px; --tab-h: 96px;
  --stroke: 1.9px;
  --ease: cubic-bezier(.2, .9, .25, 1);
  --ease-spring: cubic-bezier(.34, 1.36, .64, 1);
}
:root[data-platform="android"] {
  --font: Roboto, "Roboto Flex", "Google Sans Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Google Sans", Roboto, "Roboto Flex", system-ui, sans-serif;
  --font-num: "Google Sans", Roboto, system-ui, sans-serif;
  --fs-large: 28px; --fs-title: 22px; --fs-head: 16px; --fs-body: 16px; --fs-sub: 14px; --fs-foot: 12px; --fs-cap: 11px; --fs-tab: 12px;
  --fw-strong: 500; --fw-bold: 600;
  --r-card: 20px; --r-inner: 12px; --r-field: 4px;
  --cell-h: 56px; --bar-h: 64px; --tab-h: 80px;
  --stroke: 2px;
  --ease: cubic-bezier(.2, 0, 0, 1);
}

/* ---------- Basis ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--fg);
  font: 400 var(--fs-body)/1.35 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: var(--stroke); stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 18px; height: 18px; }
.i.lg { width: 28px; height: 28px; }
.i .dot { fill: currentColor; stroke: none; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- Titelleiste ---------- */
.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 30;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.topbar-row { height: var(--bar-h); max-width: 776px; margin: 0 auto; display: grid; grid-template-columns: minmax(96px, 1fr) minmax(0, max-content) minmax(96px, 1fr); align-items: center; gap: 8px; position: relative; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb-right { justify-content: flex-end; }
.tb-title { font-weight: var(--fw-strong); font-size: var(--fs-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; text-align: center; transition: opacity .2s; }
/* iOS 26: Inhalt läuft unter einem weichen Unschärfe-Verlauf, Tasten schweben als Glas */
[data-platform="ios"] .topbar::before {
  content: ""; position: absolute; inset: 0 0 -24px 0; z-index: -1; pointer-events: none;
  background: linear-gradient(var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 55%, transparent 100%);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent);
  opacity: 0; transition: opacity .2s;
}
[data-platform="ios"] .topbar.scrolled::before, [data-platform="ios"] .topbar.solid::before { opacity: 1; }
[data-platform="ios"] .topbar:not(.scrolled):not(.solid) .tb-title { opacity: 0; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: 0 6px 24px var(--glass-shade), inset 0 0 0 .5px var(--glass-edge), inset 0 1px 0 var(--glass-edge);
}
.navbtn { min-width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; color: var(--fg); padding: 0 10px; font-size: var(--fs-body); }
[data-platform="ios"] .navbtn { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); box-shadow: 0 4px 16px var(--glass-shade), inset 0 0 0 .5px var(--glass-edge), inset 0 1px 0 var(--glass-edge); }
[data-platform="ios"] .navbtn.icon { width: 44px; padding: 0; }
[data-platform="ios"] .navbtn.tint { background: var(--accent); color: var(--on-accent); }
[data-platform="ios"] .navbtn.text { font-weight: var(--fw-strong); }
[data-platform="ios"] .navbtn .i { stroke-width: 2.2px; }
[data-platform="android"] .topbar { background: var(--bg); transition: background-color .2s; }
[data-platform="android"] .topbar.scrolled { background: var(--surface); }
[data-platform="android"] .topbar-row { grid-template-columns: auto minmax(0, 1fr) auto; }
[data-platform="android"] .tb-title { text-align: left; font: 400 var(--fs-title)/1.2 var(--font); max-width: none; }
[data-platform="android"] .tb-left:empty { display: none; }
[data-platform="android"] .topbar-row:has(.tb-left:empty) { grid-template-columns: minmax(0, 1fr) auto; padding-left: 8px; }
[data-platform="android"] .navbtn { width: 48px; height: 48px; border-radius: 24px; padding: 0; color: var(--fg-2); position: relative; overflow: hidden; }
[data-platform="android"] .navbtn.text { width: auto; padding: 0 12px; color: var(--accent); font-weight: 500; font-size: 14px; letter-spacing: .1px; }
[data-platform="android"] .navbtn.tint { color: var(--accent); }

/* ---------- Tab-Leiste & FAB ---------- */
.tabbar { position: fixed; z-index: 30; display: flex; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--fg-2); font-size: var(--fs-tab); font-weight: var(--fw-strong); min-width: 0; position: relative; }
.tab .i .f { fill: none; }
.tab.on .i .f { fill: currentColor; }
.tab.on .i .hole { fill: var(--glass); }
[data-platform="ios"] .tabbar {
  left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px));
  bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) - 4px));
  margin: 0 auto; max-width: 420px; height: 64px; padding: 4px; border-radius: 32px;
}
[data-platform="ios"] .tab { border-radius: 28px; transition: background-color .25s var(--ease), color .2s; }
[data-platform="ios"] .tab.on { color: var(--accent); background: var(--fill); }
[data-platform="android"] .tabbar {
  left: 0; right: 0; bottom: 0; height: calc(80px + env(safe-area-inset-bottom, 0px));
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
  background: var(--surface); justify-content: center;
}
[data-platform="android"] .tab { max-width: 168px; gap: 4px; font-weight: 500; letter-spacing: .5px; }
[data-platform="android"] .tab .pill { width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color .2s; }
[data-platform="android"] .tab.on { color: var(--fg); }
[data-platform="android"] .tab.on .pill { background: var(--sec-soft); color: var(--on-sec-soft); }
[data-platform="ios"] .tab .pill { display: contents; }
.fab { position: fixed; z-index: 29; display: none; }
[data-platform="android"] .fab {
  display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--accent-soft); color: var(--on-accent-soft); font-weight: 500; font-size: 15px; letter-spacing: .1px;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .18), 0 1px 3px rgba(0, 0, 0, .12); overflow: hidden;
}
.fab[hidden] { display: none !important; }
body.no-tabs .tabbar, body.no-tabs .fab { display: none; }

/* ---------- Ansicht ---------- */
#view {
  max-width: 760px; margin: 0 auto;
  padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 4px);
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 28px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 24px;
}
body.no-tabs #view { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
.large-title { font: var(--fw-bold) var(--fs-large)/1.15 var(--font-display); letter-spacing: .2px; margin: 4px 4px -10px; }
[data-platform="android"] .large-title { display: none; }
.section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 16px; }
.section-h h2 { font-size: var(--fs-foot); font-weight: 400; color: var(--fg-2); text-transform: uppercase; letter-spacing: .3px; }
[data-platform="ios"] .section-h h2 { font-size: var(--fs-title); font-weight: var(--fw-bold); text-transform: none; color: var(--fg); letter-spacing: 0; padding: 0; }
[data-platform="ios"] .section-h { padding: 0 4px; }
[data-platform="android"] .section-h { padding: 0 4px; }
[data-platform="android"] .section-h h2 { font-size: 14px; font-weight: 500; color: var(--accent); text-transform: none; letter-spacing: .1px; }
.section-h .btn-text { font-size: var(--fs-sub); }
.foot { font-size: var(--fs-foot); color: var(--fg-2); padding: 0 16px; line-height: 1.4; }
[data-platform="android"] .foot { padding: 0 4px; }
.view-enter-push { animation: pushIn .42s var(--ease); }
.view-enter-pop { animation: popIn .32s var(--ease); }
.view-enter-tab { animation: fadeIn .2s ease-out; }
[data-platform="android"] .view-enter-push { animation: mdIn .3s var(--ease); }
[data-platform="android"] .view-enter-pop { animation: mdOut .25s var(--ease); }
@keyframes pushIn { from { transform: translateX(28%); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { transform: translateX(-12%); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes mdIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes mdOut { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Listen ---------- */
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.cell {
  display: flex; align-items: center; gap: 12px; min-height: var(--cell-h); padding: 10px 16px; width: 100%;
  text-align: left; position: relative; color: var(--fg); text-decoration: none; background: transparent;
}
.cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--sep-left, 16px); border-top: .5px solid var(--sep); }
.list.icons { --sep-left: 60px; }
.cell .lead { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--accent); color: #fff; }
.cell .lead .i { width: 20px; height: 20px; }
.cell .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cell .t1 { font-size: var(--fs-body); overflow-wrap: anywhere; }
.cell .t2 { font-size: var(--fs-sub); color: var(--fg-2); overflow-wrap: anywhere; }
.cell .trail { color: var(--fg-2); display: flex; align-items: center; gap: 6px; flex: none; font-size: var(--fs-sub); }
.cell .chev { color: var(--fg-3); }
.cell.tappable:active { background: var(--fill); }
.cell.check .tick { color: var(--accent); visibility: hidden; }
.cell.check[aria-checked="true"] .tick { visibility: visible; }
.cell .radio { display: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--fg-2); flex: none; margin: 0 14px 0 4px; position: relative; }
.cell.check[aria-checked="true"] .radio { border-color: var(--accent); }
.cell.check[aria-checked="true"] .radio::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
[data-platform="android"] .cell .radio { display: block; }
[data-platform="android"] .cell.check .tick { display: none; }
.cell.dim .t1 { color: var(--fg-3); text-decoration: line-through; }
[data-platform="android"] .list { background: transparent; border-radius: 0; gap: 2px; overflow: visible; }
[data-platform="android"] .list > .cell { background: var(--surface); border-radius: 4px; }
[data-platform="android"] .list > .cell:first-child { border-top-left-radius: var(--r-card); border-top-right-radius: var(--r-card); }
[data-platform="android"] .list > .cell:last-child { border-bottom-left-radius: var(--r-card); border-bottom-right-radius: var(--r-card); }
[data-platform="android"] .cell + .cell::before { display: none; }
[data-platform="android"] .cell .lead { border-radius: 50%; width: 40px; height: 40px; background: var(--accent-soft); color: var(--on-accent-soft); }
[data-platform="android"] .cell.tappable { overflow: hidden; }
[data-platform="android"] .cell.tappable:active { background: color-mix(in srgb, var(--fg) 10%, var(--surface)); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-cap); font-weight: var(--fw-strong); padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--fg-2); white-space: nowrap; }
.badge.tint { background: var(--accent-soft); color: var(--on-accent-soft); }
.badge.live { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok-text); }
.badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn-text); }

/* Sport-Marke (kleines Spielfeld) */
.sport-mark { width: 40px; height: 40px; border-radius: 11px; flex: none; position: relative; overflow: hidden; background: var(--court, var(--court-padel)); }
.sport-mark svg { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); stroke: var(--court-line); fill: none; stroke-width: 1.2; }
[data-platform="android"] .sport-mark { border-radius: 50%; }
.c-padel { --court: var(--court-padel); }
.c-pickleball { --court: var(--court-pickleball); }
.c-tennis { --court: var(--court-tennis); }

/* ---------- Karten, Knöpfe, Bedienelemente ---------- */
.card { background: var(--surface); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: var(--fs-body); font-weight: var(--fw-strong);
  background: var(--fill); color: var(--accent); position: relative; overflow: hidden; white-space: nowrap; transition: transform .15s var(--ease), opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn.filled { background: var(--accent); color: var(--on-accent); }
.btn.tonal { background: var(--accent-soft); color: var(--on-accent-soft); }
.btn.plain { background: transparent; padding: 0 10px; }
.btn.danger { color: var(--danger); }
.btn.filled.danger { background: var(--danger); color: #fff; }
.btn.big { min-height: 52px; font-size: var(--fs-body); padding: 0 24px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn .i { width: 20px; height: 20px; }
[data-platform="android"] .btn { min-height: 48px; font-size: 14px; font-weight: 500; letter-spacing: .1px; padding: 0 24px; background: transparent; border: 1px solid var(--sep); color: var(--accent); }
[data-platform="android"] .btn.filled { background: var(--accent); color: var(--on-accent); border-color: transparent; }
[data-platform="android"] .btn.tonal { background: var(--sec-soft); color: var(--on-sec-soft); border-color: transparent; }
[data-platform="android"] .btn.plain { border-color: transparent; padding: 0 12px; }
[data-platform="android"] .btn.big { min-height: 56px; font-size: 16px; border-radius: 16px; }
[data-platform="android"] .btn.filled.danger { background: var(--danger); color: var(--bg); }
[data-platform="android"] .btn::after, [data-platform="android"] .navbtn::after, [data-platform="android"] .fab::after, [data-platform="android"] .tab .pill::after {
  content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; border-radius: inherit; pointer-events: none;
}
[data-platform="android"] .btn:active::after, [data-platform="android"] .navbtn:active::after, [data-platform="android"] .fab:active::after { opacity: .12; }
[data-platform="android"] .btn:active { transform: none; border-radius: 12px; }
.btn-text { color: var(--accent); font-size: var(--fs-body); padding: 6px 4px; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; }
.btn-text:active { opacity: .5; }
.btn-text[disabled] { opacity: .35; pointer-events: none; }

.seg { display: flex; padding: 2px; border-radius: 10px; background: var(--fill); position: relative; min-width: 0; }
.seg button { flex: 1; min-height: 32px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--fg); padding: 0 8px; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--thumb); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04); }
[data-platform="ios"] .seg { border-radius: 999px; }
[data-platform="ios"] .seg button { border-radius: 999px; min-height: 34px; }
[data-platform="android"] .seg { background: transparent; padding: 0; gap: 2px; border-radius: 0; }
[data-platform="android"] .seg button { min-height: 40px; border-radius: 4px; background: var(--surface-2); color: var(--fg); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
[data-platform="android"] .seg button:first-child { border-radius: 20px 4px 4px 20px; }
[data-platform="android"] .seg button:last-child { border-radius: 4px 20px 20px 4px; }
[data-platform="android"] .seg button:only-child { border-radius: 20px; }
[data-platform="android"] .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; border-radius: 20px; }

.tabs { display: flex; border-bottom: 1px solid var(--sep); margin: 0 -16px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; min-height: 48px; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--fg-2); position: relative; }
.tabs button[aria-pressed="true"] { color: var(--accent); }
.tabs button[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 48px; transform: translateX(-50%); height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }

.switch { appearance: none; -webkit-appearance: none; flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-strong); position: relative; cursor: pointer; transition: background-color .25s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 3px 1px rgba(0, 0, 0, .06); transition: transform .25s var(--ease-spring); }
.switch:checked { background: var(--ok); }
.switch:checked::after { transform: translateX(20px); }
[data-platform="android"] .switch { width: 52px; height: 32px; background: var(--fill); box-shadow: inset 0 0 0 2px var(--fg-3); }
[data-platform="android"] .switch::after { top: 8px; left: 8px; width: 16px; height: 16px; background: var(--fg-3); box-shadow: none; transition: transform .25s var(--ease), width .2s, height .2s, top .2s, left .2s; }
[data-platform="android"] .switch:checked { background: var(--accent); box-shadow: none; }
[data-platform="android"] .switch:checked::after { top: 4px; left: 4px; width: 24px; height: 24px; background: var(--on-accent); transform: translateX(20px); }

.stepper { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.stepper button { width: 44px; height: 36px; display: grid; place-items: center; background: var(--fill); color: var(--fg); }
.stepper button:first-child { border-radius: 10px 4px 4px 10px; }
.stepper button:last-child { border-radius: 4px 10px 10px 4px; }
.stepper button:active { background: var(--fill-strong); }
.stepper output { min-width: 44px; text-align: center; font-weight: var(--fw-strong); font-variant-numeric: tabular-nums; }
[data-platform="ios"] .stepper button:first-child { border-radius: 999px 6px 6px 999px; }
[data-platform="ios"] .stepper button:last-child { border-radius: 6px 999px 999px 6px; }
[data-platform="android"] .stepper button { width: 48px; height: 48px; border-radius: 50% !important; background: transparent; color: var(--fg-2); border: 1px solid var(--sep); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--fill); color: var(--fg); font-size: var(--fs-sub); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip.static { pointer-events: none; }
[data-platform="android"] .chip { border-radius: 8px; background: transparent; border: 1px solid var(--sep); min-height: 32px; font-size: 14px; }
[data-platform="android"] .chip[aria-pressed="true"] { background: var(--sec-soft); color: var(--on-sec-soft); border-color: transparent; }
[data-platform="android"] .chip[aria-pressed="true"]::before { content: "✓"; font-size: 13px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: var(--fs-foot); color: var(--fg-2); padding: 0 4px; }
.input {
  width: 100%; min-height: 44px; padding: 10px 14px; border-radius: var(--r-field); border: 0; background: var(--surface); color: var(--fg);
  font-size: var(--fs-body); outline: none; -webkit-appearance: none; appearance: none;
}
.card .input, .sheet .input { background: var(--fill); }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.4; }
.input::placeholder { color: var(--fg-3); }
[data-platform="android"] .input, [data-platform="android"] .card .input, [data-platform="android"] .sheet .input { background: transparent; border: 1px solid var(--fg-3); min-height: 56px; padding: 14px 16px; }
[data-platform="android"] .input:focus { border: 2px solid var(--accent); padding: 13px 15px; }
.addrow { display: flex; gap: 8px; align-items: stretch; }
.addrow .input { flex: 1; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--fg-2); flex: none; position: relative; }
.iconbtn:active { background: var(--fill); }
.iconbtn.tint { background: var(--accent); color: var(--on-accent); }
[data-platform="android"] .iconbtn { width: 48px; height: 48px; }
[data-platform="android"] .iconbtn.tint { border-radius: 16px; background: var(--accent-soft); color: var(--on-accent-soft); width: 56px; }

/* ---------- Jetzt-Karte & Timer ---------- */
.next { padding: 20px; gap: 14px; }
.next .state { display: flex; align-items: center; gap: 8px; }
.next h2 { font: var(--fw-bold) 26px/1.15 var(--font-display); }
.next p { color: var(--fg-2); font-size: var(--fs-sub); }
[data-platform="android"] .next { background: var(--accent-soft); color: var(--on-accent-soft); border-radius: 28px; }
[data-platform="android"] .next p { color: inherit; opacity: .85; }
[data-platform="android"] .next .badge.tint { background: var(--bg); color: var(--accent); }
[data-platform="android"] .next h2 { font: 400 28px/1.15 var(--font-display); }
.next .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.next .actions .btn.filled { flex: 1 1 200px; }
.timer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer .clock { font: 600 clamp(40px, 12vw, 56px)/1 var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -1px; flex: 1 0 auto; }
.timer .clock.warn { color: var(--warn); }
.timer .clock.over { color: var(--danger); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.timer .ctl { display: flex; gap: 8px; }
.timer .ctl .iconbtn { background: var(--fill); color: var(--fg); width: 52px; height: 52px; }
.timer .ctl .iconbtn.go { background: var(--ok); color: #fff; }
.timer .ctl .iconbtn.stop { background: var(--warn); color: #fff; }
.timer .bar { width: 100%; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.timer .bar span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s linear; }
[data-platform="android"] .timer .ctl .iconbtn { border-radius: 16px; background: color-mix(in srgb, var(--on-accent-soft) 12%, transparent); color: inherit; }
[data-platform="android"] .timer .ctl .iconbtn.go { background: var(--accent); color: var(--on-accent); }
[data-platform="android"] .timer .ctl .iconbtn.stop { background: var(--on-accent-soft); color: var(--accent-soft); }
[data-platform="android"] .timer .bar { background: color-mix(in srgb, var(--on-accent-soft) 16%, transparent); }
[data-platform="android"] .timer .bar span { background: var(--on-accent-soft); }
.timeup { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: color-mix(in srgb, var(--danger) 88%, black); color: #fff; text-align: center; padding: 24px; animation: fadeIn .2s; }
.timeup strong { display: block; font: 800 64px/1 var(--font-display); }
.timeup p { font-size: 20px; margin-top: 12px; opacity: .9; }

/* ---------- Spielfeld-Karten ---------- */
.courts { display: grid; grid-template-columns: 1fr; gap: 12px; }
.match { border-radius: var(--r-card); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.match-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: var(--fs-sub); min-height: 44px; }
.match-h .name { font-weight: var(--fw-strong); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.match-h .meta { color: var(--fg-2); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.field-court { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; background: var(--court); color: var(--on-court); aspect-ratio: 2 / 1; width: calc(100% - 12px); margin: 0 6px 6px; border-radius: calc(var(--r-card) - 6px); overflow: hidden; }
.field-court > svg.lines *, .sport-mark svg * { vector-effect: non-scaling-stroke; }
.field-court > svg.lines { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); stroke: var(--court-line); fill: none; stroke-width: 1.4; pointer-events: none; opacity: .75; }
.field-court > svg.lines .net { stroke-width: 3; }
.field-court > svg.lines .wall { stroke-width: 3; }
.side { position: relative; z-index: 1; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 600; font-size: var(--fs-sub); line-height: 1.2; text-align: center; color: inherit; min-width: 0; overflow-wrap: anywhere; transition: background-color .2s, opacity .2s; }
.side .pn { max-width: 100%; padding: 1px 6px; border-radius: 6px; background: color-mix(in srgb, var(--court) 78%, transparent); }
.side .pn { display: block; text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.side.win .pn { background: rgba(255, 255, 255, .95); color: var(--court); }
.side.win .pn:first-child::before { content: "★ "; color: var(--gold); }
.side.lose { opacity: .6; }
button.side:active { background: rgba(255, 255, 255, .22); }
.net-score { position: relative; z-index: 1; align-self: center; min-width: 64px; padding: 8px 10px; border-radius: 14px; background: rgba(0, 0, 0, .32); color: #fff; font: 700 22px/1 var(--font-num); font-variant-numeric: tabular-nums; text-align: center; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.net-score.empty { font-size: 13px; font-weight: 600; padding: 9px 10px; }
.net-score.sets { font-size: 15px; line-height: 1.25; }
.match .hint { font-size: var(--fs-foot); color: var(--fg-2); padding: 0 14px 10px; }
.match.done .field-court { filter: saturate(.75); }
[data-platform="android"] .match { background: var(--surface); }
.byes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-sub); color: var(--fg-2); padding: 0 4px; }
.mini-court { width: 100%; height: 100%; }

/* ---------- Tabelle ---------- */
.table-wrap { overflow-x: auto; border-radius: var(--r-card); background: var(--surface); }
table.st { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: var(--fs-sub); }
table.st th { font-size: var(--fs-cap); font-weight: var(--fw-strong); color: var(--fg-2); text-align: right; padding: 10px 8px 6px; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; }
table.st th:nth-child(2) { text-align: left; }
table.st td { padding: 10px 8px; text-align: right; border-top: .5px solid var(--sep); white-space: nowrap; }
table.st td.n { text-align: left; white-space: normal; overflow-wrap: anywhere; font-weight: 500; width: 100%; }
table.st td.r, table.st th.r { width: 36px; text-align: center; padding-left: 12px; }
table.st td.strong { font-weight: 700; }
table.st tr.off td.n { color: var(--fg-3); }
.rank { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 700; font-size: 13px; }
.rank.r1 { background: var(--gold); color: #fff; }
.rank.r2 { background: var(--silver); color: #fff; }
.rank.r3 { background: var(--bronze); color: #fff; }
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; text-align: center; }
.podium .step { display: flex; flex-direction: column; gap: 6px; align-items: center; min-width: 0; }
.podium .who { font-weight: 600; font-size: var(--fs-sub); overflow-wrap: anywhere; }
.podium .block { width: 100%; border-radius: 14px 14px 6px 6px; display: grid; place-items: center; color: #fff; font: 800 28px/1 var(--font-num); }
.podium .p1 .block { height: 104px; background: var(--gold); }
.podium .p2 .block { height: 78px; background: var(--silver); }
.podium .p3 .block { height: 58px; background: var(--bronze); }

/* ---------- Plan & Turnierbaum ---------- */
.round { display: flex; flex-direction: column; gap: 0; }
.round-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; min-height: 48px; width: 100%; text-align: left; }
.round-h .t { font-weight: var(--fw-strong); flex: 1; }
.pline { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 10px 16px; border-top: .5px solid var(--sep); font-size: var(--fs-sub); width: 100%; text-align: left; }
.pline .c { color: var(--fg-2); font-size: var(--fs-foot); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pline .s { font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; min-width: 48px; }
.pline .tb { text-align: right; }
.pline .w { font-weight: 700; }
.pline .me { background: var(--accent-soft); color: var(--on-accent-soft); border-radius: 6px; padding: 0 4px; }
.pline.byes-line { grid-template-columns: 64px 1fr; color: var(--fg-2); }

/* ---------- Ebenen: Sheets, Dialoge, Menüs, Hinweise ---------- */
.layer { position: fixed; inset: 0; z-index: 60; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fadeIn .25s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px);
  display: flex; flex-direction: column; background: var(--sheet); color: var(--fg);
  animation: sheetUp .38s var(--ease); overflow: hidden;
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.layer.out .sheet, .layer.out .page { animation: sheetDown .25s ease-in forwards; }
.layer.out .scrim, .layer.out .dialog, .layer.out .menu { animation: fadeOut .2s forwards; }
@keyframes sheetDown { to { transform: translateY(100%); } }
@keyframes fadeOut { to { opacity: 0; } }
[data-platform="ios"] .sheet { left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom, 0px)); border-radius: 34px; box-shadow: 0 10px 40px rgba(0, 0, 0, .2); }
[data-platform="android"] .sheet { border-radius: 28px 28px 0 0; background: var(--sheet); }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill-strong); margin: 8px auto 0; flex: none; }
[data-platform="android"] .grabber { width: 32px; height: 4px; margin: 16px auto 4px; background: var(--fg-3); opacity: .6; }
.sheet-h { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 12px 4px; min-height: 52px; flex: none; }
.sheet-h .t { font-weight: var(--fw-strong); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-h .r { display: flex; justify-content: flex-end; }
[data-platform="android"] .sheet-h { grid-template-columns: minmax(0, 1fr) auto; padding: 4px 16px 4px 24px; }
[data-platform="android"] .sheet-h .l { display: none; }
[data-platform="android"] .sheet-h .t { text-align: left; font: 400 22px/1.2 var(--font); }
.sheet-b { overflow-y: auto; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
[data-platform="android"] .sheet-b { padding: 8px 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet-f { padding: 12px 16px 16px; display: flex; gap: 8px; flex: none; border-top: .5px solid var(--sep); }
[data-platform="android"] .sheet-f { border-top: 0; padding: 8px 24px calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet-f .btn { flex: 1; }
/* Vollbild-Seite (Neues Turnier) */
