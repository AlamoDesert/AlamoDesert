# Cloudflare Pages: statische Dateien aus public/, API aus functions/ mit D1-Datenbank.
# Einmalig die Datenbank anlegen: npx wrangler d1 create reisekasse
# und die ausgegebene database_id unten eintragen.
# Veröffentlichen: CLOUDFLARE_API_TOKEN=… CLOUDFLARE_ACCOUNT_ID=… npx wrangler pages deploy
name = "reisekasse"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "reisekasse"
database_id = "REPLACE_WITH_D1_ID"
