<title>Rezeption Schichtcheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky Kopf mit Datum + Schicht-Tabs, darunter eine Zeitleiste aus Phasen (Uhrzeit links, Aufgaben rechts). */
:root {
  --bg: #eef2f6; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #142130; --muted: #5a6879; --line: #d7dee7;
  --accent: #1d5bb8; --accent-soft: #e2ecfa; --done: #23804f; --done-soft: #e1f2e8;
  --warn: #c0392b; --warn-soft: #fbe6e3; --na: #8a96a5; --now: #d98a12; --now-soft: #fdf1dc;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1620; --surface: #17212d; --surface-2: #1c2836; --ink: #e6edf5; --muted: #95a3b4; --line: #2b3a4b;
  --accent: #6aa2f2; --accent-soft: #1d3150; --done: #4cc184; --done-soft: #173627;
  --warn: #f07a6c; --warn-soft: #3d1f1c; --na: #6d7a8a; --now: #f0b04f; --now-soft: #3a2c14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1620; --surface: #17212d; --surface-2: #1c2836; --ink: #e6edf5; --muted: #95a3b4; --line: #2b3a4b;
  --accent: #6aa2f2; --accent-soft: #1d3150; --done: #4cc184; --done-soft: #173627;
  --warn: #f07a6c; --warn-soft: #3d1f1c; --na: #6d7a8a; --now: #f0b04f; --now-soft: #3a2c14; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line) }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; margin: 0; flex: 1; min-width: 0 }
.brand small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; letter-spacing: .04em; color: var(--muted); text-transform: none }
.datenav { display: flex; align-items: center; gap: 4px }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; font-size: 18px; line-height: 1 }
.datebtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 36px; padding: 0 12px; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; overflow: hidden }
.datebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100% }
.todaybtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0 4px; height: 36px }

.tabs { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-top: 10px }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 12px; text-align: left; display: grid; gap: 4px }
.tab b { font-family: var(--f-display); font-size: 17px; letter-spacing: .03em; text-transform: uppercase }
.tab .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.tab.month { align-content: center; text-align: center }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s }

.status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px }
.status.err { color: var(--warn) }

/* Zeitleiste */
.timeline { display: grid; gap: 18px; margin-top: 18px }
.phase { display: grid; grid-template-columns: 64px 1fr; gap: 12px }
.when { font-family: var(--f-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--muted); padding-top: 10px; text-align: right; line-height: 1.1 }
.when small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11px }
.phase.is-now .when { color: var(--now) }
.phase.is-late .when { color: var(--warn) }
.phase.is-done .when { color: var(--done) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; overflow: hidden }
.phase.is-now .card { border-color: var(--now); box-shadow: 0 0 0 1px var(--now) }
.phead { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap }
.phead h2 { margin: 0; font-family: var(--f-display); font-size: 17px; letter-spacing: .04em; text-transform: uppercase; flex: 1; min-width: 0 }
.phead .hint { font-size: 12px; color: var(--muted) }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent) }
.pill.now { background: var(--now-soft); color: var(--now) }
.pill.late { background: var(--warn-soft); color: var(--warn) }
.pill.done { background: var(--done-soft); color: var(--done) }

ul.items { list-style: none; margin: 0; padding: 0 }
ul.items li { display: flex; align-items: stretch; border-top: 1px solid var(--line) }
ul.items li:first-child { border-top: 0 }
.check { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: flex-start; text-align: left; background: none; border: 0; padding: 12px 14px; min-height: 52px }
.box { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: -1px; transition: background .15s, border-color .15s }
.box svg { width: 16px; height: 16px; opacity: 0 }
.txt { min-width: 0 }
.txt .label { font-weight: 500 }
.txt .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px }
.txt .who { display: block; font-size: 12px; color: var(--done); margin-top: 3px; font-variant-numeric: tabular-nums }
li.important .label { color: var(--warn) }
li.done .box { background: var(--done); border-color: var(--done) }
li.done .box svg { opacity: 1 }
li.done .label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line) }
li.na .box { border-style: dashed; border-color: var(--na) }
li.na .label { color: var(--na) }
li.na .who { color: var(--na) }
.skip { flex: none; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 0 12px }
li.na .skip { color: var(--ink); background: var(--surface-2) }

/* Rundgänge */
.rounds { padding: 12px 14px; display: grid; gap: 8px; border-top: 1px solid var(--line) }
.rounds .label { font-weight: 500 }
.rounds .label span { color: var(--warn) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 0; width: 58px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px }
.chip.done { background: var(--done); border-color: var(--done); color: #fff }
.chip.now { border-color: var(--now); box-shadow: inset 0 0 0 1px var(--now) }
.chip.late { border-color: var(--warn); color: var(--warn) }

/* Monat */
.monthhead { display: flex; align-items: center; gap: 8px; margin-top: 18px }
.monthhead h2 { margin: 0; font-family: var(--f-display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; flex: 1 }
.mscroll { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table.mgrid { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; width: 100% }
.mgrid th, .mgrid td { padding: 0; border-bottom: 1px solid var(--line); text-align: center }
.mgrid thead th { font-weight: 600; color: var(--muted); padding: 8px 4px; font-size: 12px }
.mgrid th.rowh { text-align: left; padding: 8px 12px; white-space: nowrap; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .04em; font-size: 14px; position: sticky; left: 0; background: var(--surface) }
.mgrid tr:last-child td, .mgrid tr:last-child th { border-bottom: 0 }
.mcell { border: 0; background: none; width: 100%; min-width: 34px; height: 36px; font-size: 12px; font-weight: 600 }
.mcell.full { background: var(--done-soft); color: var(--done) }
.mcell.part { background: var(--now-soft); color: var(--now) }
.mcell.none { color: var(--line) }
.mcell.sel { box-shadow: inset 0 0 0 2px var(--accent) }
.mcell.future { color: var(--line) }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px }

.empty { color: var(--muted); padding: 20px 0 }
@media (max-width: 480px) {
  .phase { grid-template-columns: 1fr; gap: 6px }
  .when { text-align: left; padding-top: 0; display: flex; gap: 8px; align-items: baseline }
  .tab { padding: 8px 10px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap">
  <header class="top">
    <div class="row">
      <h1 class="brand">Checkliste Rezeption<small id="weekday">–</small></h1>
      <div class="datenav">
        <button class="iconbtn" id="prev" aria-label="Vorheriger Tag">‹</button>
        <label class="datebtn"><span id="datelabel">–</span><input type="date" id="datepick" aria-label="Datum wählen"></label>
        <button class="iconbtn" id="next" aria-label="Nächster Tag">›</button>
        <button class="todaybtn" id="today">Heute</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-frueh" data-view="frueh"><b>Frühschicht</b><span class="meta" id="meta-frueh">–</span><span class="bar"><i id="bar-frueh"></i></span></button>
      <button class="tab" role="tab" id="tab-spaet" data-view="spaet"><b>Spätschicht</b><span class="meta" id="meta-spaet">–</span><span class="bar"><i id="bar-spaet"></i></span></button>
      <button class="tab month" role="tab" id="tab-monat" data-view="monat"><b>Monat</b></button>
    </div>
    <div class="status" id="status">Verbinde…</div>
  </header>
  <main id="main"></main>
</div>

<script>
(() => {
  "use strict";

  // ---------- Checkliste (Stand: Aushang „Checkliste neue Rezeption") ----------
  // Zeiten als "HH:MM". important = rot auf dem Aushang. optional = darf als „entfällt" markiert werden.
  const SHIFTS = {
    frueh: {
      label: "Frühschicht", start: "07:30", end: "15:00",
      rounds: [8, 9, 10, 11, 12, 13, 14],
      phases: [
        { id: "open", title: "Öffnen", from: "07:30", to: "08:00", hint: "direkt bei Schichtbeginn", items: [
          { id: "f_lager", t: "Lager (hinter Rezeption) aufschließen" },
          { id: "f_ruf", t: "Rufweiterleitung deaktivieren" },
          { id: "f_nubsi", t: "Neue Eingangstür „Nubsi“ verstellen" },
          { id: "f_kuehl_auf", t: "Kühlschränke aufschließen + Licht an" },
          { id: "f_kaffee", t: "Kaffeemaschine anstellen", s: "rechts hinter dem Display" },
          { id: "f_musik", t: "Musik an über Sonos" },
          { id: "f_tv", t: "Beide Fernseher anmachen" },
          { id: "f_fenster", t: "Fenster öffnen/schließen je nach Wetter" },
        ]},
        { id: "setup", title: "Rezeption einrichten", from: "08:00", to: "09:00", hint: "vor den ersten Buchungen", items: [
          { id: "f_spint", t: "Schläger/Bälle vom Vorabend aus dem Rückgabespint nehmen", s: "Schläger-Nr. korrekt hinterlegt? Auf Schäden prüfen." },
          { id: "f_merch", t: "Merch und Testschläger vorne an die Wand hängen" },
          { id: "f_rezeption", t: "Rezeption aufbauen", s: "Aufsteller, Kaffeebecher + Extras, Spendenbox, Preisliste, Eisliste, Snickers, Müsliriegel, Griffbänder" },
          { id: "f_kuehl_fuell", t: "Kühlschränke auffüllen" },
        ]},
        { id: "orga", title: "Orga & Kommunikation", from: "09:00", to: "11:00", hint: "am Vormittag", items: [
          { id: "f_excel", t: "Neuerungen in der Excel (SharePoint) prüfen" },
          { id: "f_whatsapp", t: "WhatsApp-Chats abarbeiten" },
          { id: "f_checkin", t: "Check-ins erledigen" },
          { id: "f_bestand", t: "Bestand Schläger + Bälle prüfen → sortieren" },
        ]},
        { id: "laufend", title: "Laufend", from: "07:30", to: "15:00", hint: "über die ganze Schicht", running: true, items: [
          { id: "f_wasser", t: "Wasserspender regelmäßig wischen", important: true },
          { id: "f_muell", t: "Müll rausbringen, wenn voll", optional: true },
        ]},
        { id: "handover", title: "Übergabe", from: "14:30", to: "15:00", hint: "vor Schichtende", items: [
          { id: "f_spuel", t: "Spülbecken (Lager) sauberhalten", important: true },
          { id: "f_info", t: "Info an Spätschicht, falls Check-ins nicht geschafft", optional: true },
        ]},
      ],
    },
    spaet: {
      label: "Spätschicht", start: "15:00", end: "23:00",
      rounds: [15, 16, 17, 18, 19, 20, 21, 22],
      phases: [
        { id: "start", title: "Schichtstart", from: "15:00", to: "15:30", hint: "nach der Übergabe", items: [
          { id: "s_excel", t: "Neuerungen in der Excel (SharePoint) prüfen" },
          { id: "s_checkin", t: "Check-ins erledigen, wenn noch offen" },
          { id: "s_whatsapp", t: "WhatsApp-Chats abarbeiten" },
          { id: "s_fenster", t: "Fenster öffnen/schließen je nach Wetter" },
        ]},
        { id: "laufend", title: "Laufend", from: "15:00", to: "23:00", hint: "über die ganze Schicht", running: true, items: [
          { id: "s_wasser", t: "Wasserspender regelmäßig wischen", important: true },
          { id: "s_muell", t: "Müll rausbringen, wenn voll", optional: true },
        ]},
        { id: "licht", title: "Licht an", from: "18:30", to: "19:30", hint: "je nach Dunkelheit", items: [
          { id: "s_flutlicht_an", t: "Tennis-Flutlicht anstellen", s: "ab ca. 18:30, je nach Dunkelheit", important: true },
          { id: "s_plejd", t: "Outdoor-Plätze: Licht über Plejd anmachen", s: "geht automatisch um 22:10 Uhr aus" },
        ]},
        { id: "kunden", title: "Kunden informieren", from: "20:00", to: "21:00", items: [
          { id: "s_kunden", t: "Kunden für abends ab 22 Uhr und morgens (8–10 Uhr) anschreiben und informieren" },
        ]},
        { id: "plaetze", title: "Plätze", from: "21:00", to: "21:30", hint: "nach den Buchungen", items: [
          { id: "s_flutlicht_aus", t: "Tennis-Flutlicht ausstellen", s: "spätestens 21:10 Uhr", important: true },
          { id: "s_waessern", t: "Tennisplätze 3× hintereinander wässern", s: "nur wenn es sehr trocken ist, nach 21 Uhr", optional: true },
        ]},
        { id: "abbau", title: "Abbau", from: "22:00", to: "22:30", hint: "nach der letzten Buchung", items: [
          { id: "s_merch", t: "Merch + Testschläger hinten in den Raum wegräumen" },
          { id: "s_rezeption", t: "Rezeption abbauen", s: "Aufsteller alter Tresen 2×, neuer Tresen 1×, Kaffeebecher + Extras, Spendenbox, Preisliste, Eisliste, Snickers, Müsliriegel, Griffbänder" },
          { id: "s_spinte", t: "Rückgabe-Spinte mit LE füllen", s: "Notiz in der Buchung: Schläger-Nr. + evtl. Bälle", important: true },
          { id: "s_kaffee", t: "Kaffeemaschine reinigen" },
          { id: "s_kuehl", t: "Kühlschränke auffüllen + Licht aus + abschließen" },
          { id: "s_spuel", t: "Spülbecken (Lager) sauberhalten", important: true },
        ]},
        { id: "close", title: "Abschließen", from: "22:30", to: "23:00", hint: "in dieser Reihenfolge", items: [
          { id: "s_musik", t: "Musik aus über Sonos/Spotify" },
          { id: "s_tv", t: "Fernseher ausmachen" },
          { id: "s_laden", t: "Laptop + Handy laden" },
          { id: "s_schiebe", t: "Schiebefenster abschließen", s: "roter Punkt" },
          { id: "s_ruf", t: "Rufweiterleitung aktivieren, Info an G/D/D/J" },
          { id: "s_nubsi", t: "Neue Eingangstür „Nubsi“ verstellen" },
          { id: "s_alte", t: "„Alte“ Eingangstür (mit Code) abschließen", s: "Gummiband abmachen, prüfen ob abgeschlossen" },
        ]},
      ],
    },
  };
  const roundId = (shift, h) => `${shift === "frueh" ? "f" : "s"}_rund_${String(h).padStart(2, "0")}`;
  const shiftIds = (key) => {
    const s = SHIFTS[key];
    return [...s.phases.flatMap(p => p.items.map(i => i.id)), ...s.rounds.map(h => roundId(key, h))];
  };
  const IDS = { frueh: shiftIds("frueh"), spaet: shiftIds("spaet") };

  // ---------- Helfer ----------
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  // ---------- Zustand ----------
  const state = {
    date: isoDate(new Date()),
    view: nowMin() < toMin(SHIFTS.spaet.start) ? "frueh" : "spaet",
    checks: {},          // id -> {s:"done"|"na", by, at}
    docExists: false,
    month: {},           // date -> checks (Monatsübersicht)
    names: {},           // userId -> Anzeigename
    mode: "loading",     // "shared" | "local" | "loading"
    readOnly: false,
  };
  let db = null, user = null, myId = null, unsubDay = null, unsubMonth = null, monthKey = null;
  let writeChain = Promise.resolve();

  // ---------- Speicher: geteilte DB, sonst lokal ----------
  const LS = {
    read(date) { try { return JSON.parse(localStorage.getItem("rz:" + date) || "{}"); } catch { return {}; } },
    write(date, checks) { try { localStorage.setItem("rz:" + date, JSON.stringify(checks)); return true; } catch { return false; } },
    month(ym) {
      const out = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("rz:" + ym)) out[k.slice(3)] = JSON.parse(localStorage.getItem(k) || "{}");
        }
      } catch { /* Speicher blockiert */ }
      return out;
    },
  };

  function setStatus(text, err = false) { const el = $("status"); el.textContent = text; el.classList.toggle("err", err); }

  function subscribeDay() {
    if (unsubDay) { unsubDay(); unsubDay = null; }
    if (state.mode !== "shared") { state.checks = LS.read(state.date); state.docExists = true; render(); return; }
    state.checks = state.month[state.date] || {};
    state.docExists = !!state.month[state.date];
    render();
    unsubDay = db.doc("days/" + state.date).onSnapshot(
      (snap) => {
        state.docExists = snap.exists;
        state.checks = (snap.exists && snap.data().checks) || {};
        resolveNames(state.checks);
        render();
      },
      (e) => setStatus("Verbindung unterbrochen (" + (e && e.code || "Fehler") + "). Seite neu laden.", true),
    );
  }

  function subscribeMonth() {
    const ym = state.date.slice(0, 7);
    if (ym === monthKey && (unsubMonth || state.mode === "local")) return;
    monthKey = ym;
    if (unsubMonth) { unsubMonth(); unsubMonth = null; }
    if (state.mode !== "shared") { state.month = LS.month(ym); return; }
    state.month = {};
    unsubMonth = db.collection("days").where("month", "==", ym).onSnapshot(
      (snap) => {
        const m = {};
        snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data().checks || {}; });
        state.month = m;
        if (state.view === "monat") render(); else renderTabs();
      },
      () => { /* Monatsübersicht optional; Tagesansicht bleibt nutzbar */ },
    );
  }

  async function resolveNames(checks) {
    if (!user || typeof user.profiles !== "function") return;
    const ids = [...new Set(Object.values(checks).filter(Boolean).map(c => c.by).filter(id => id && !(id in state.names)))];
    if (!ids.length) return;
    try {
      const ps = await user.profiles(ids);
      ids.forEach(id => { state.names[id] = (ps && ps[id] && ps[id].name) || ""; });
      render();
    } catch { /* Namen sind optional */ }
  }

  function setCheck(id, value) {
    if (state.readOnly) { setStatus("Nur Lesezugriff – Änderungen werden nicht gespeichert.", true); return; }
    const date = state.date;
    const next = { ...state.checks, [id]: value };
    if (!value) delete next[id];
    state.checks = next;
    if (state.mode === "shared") state.month = { ...state.month, [date]: next };
    render();

    if (state.mode !== "shared") {
      if (!LS.write(date, next)) setStatus("Browser-Speicher blockiert – Haken gehen beim Neuladen verloren.", true);
      state.month = { ...state.month, [date]: next };
      return;
    }
    // Pro Dokument immer nur ein Schreibvorgang gleichzeitig.
    writeChain = writeChain.then(async () => {
      const ref = db.doc("days/" + date);
      try {
        if (state.docExists && date === state.date) {
          await ref.update({ checks: { [id]: value } });
        } else {
          const snap = await ref.get();
          if (snap.exists) await ref.update({ checks: { [id]: value } });
          else await ref.set({ month: date.slice(0, 7), checks: next });
        }
        setStatus(statusLine());
      } catch (e) {
        const code = e && e.code;
        if (code === "permission_denied" || code === "not_granted") {
          state.readOnly = true;
          setStatus("Nur Lesezugriff – bitte Bearbeitungsrechte beim Besitzer anfragen.", true);
        } else {
          setStatus("Speichern fehlgeschlagen (" + (code || "Fehler") + "). Bitte erneut abhaken.", true);
        }
      }
    });
  }

  function statusLine() {
    if (state.mode === "shared") return "Live geteilt – alle sehen denselben Stand.";
    if (state.mode === "local") return "Nur auf diesem Gerät gespeichert.";
    return "Verbinde…";
  }

  // ---------- Berechnungen ----------
  function progress(key, checks) {
    const ids = IDS[key];
    const done = ids.filter(id => checks[id]).length;
    return { done, total: ids.length, pct: ids.length ? Math.round(done / ids.length * 100) : 0 };
  }
  // Zeitbezug nur für heute; Vergangenheit = alles fällig, Zukunft = nichts fällig.
  function timeCtx() {
    const today = isoDate(new Date());
    if (state.date < today) return "past";
    if (state.date > today) return "future";
    return nowMin();
  }
  function phaseState(phase, checks, ctx) {
    const open = phase.items.filter(i => !checks[i.id]).length;
    if (!open) return "done";
    if (ctx === "future") return "later";
    if (ctx === "past") return "late";
    const from = toMin(phase.from), to = toMin(phase.to);
    if (ctx >= to && !phase.running) return "late";
    if (ctx >= from && ctx < to) return "now";
    return "later";
  }

  // ---------- Rendering ----------
  function renderTabs() {
    const d = parseIso(state.date);
    $("weekday").textContent = WD[d.getDay()] + (state.date === isoDate(new Date()) ? " · heute" : "");
    $("datelabel").textContent = `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
    $("datepick").value = state.date;
    for (const key of ["frueh", "spaet"]) {
      const p = progress(key, state.checks);
      $("meta-" + key).textContent = `${SHIFTS[key].start}–${SHIFTS[key].end} · ${p.done}/${p.total}`;
      $("bar-" + key).style.width = p.pct + "%";
    }
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === state.view)));
  }

  function whoLine(c) {
    if (!c) return "";
    const name = (c.by && state.names[c.by]) || (c.by && c.by === myId ? "dir" : "");
    const time = fmtTime(c.at);
    const verb = c.s === "na" ? "entfällt" : "erledigt";
    return `${verb}${time ? " " + time : ""}${name ? " · " + esc(name) : ""}`;
  }

  function itemHtml(item) {
    const c = state.checks[item.id];
    const cls = [item.important ? "important" : "", c ? (c.s === "na" ? "na" : "done") : ""].join(" ");
    return `<li class="${cls}">
      <button class="check" data-id="${item.id}" aria-pressed="${!!c}">
        <span class="box">${CHECK_SVG}</span>
        <span class="txt"><span class="label">${esc(item.t)}</span>${item.s ? `<span class="sub">${esc(item.s)}</span>` : ""}${c ? `<span class="who">${whoLine(c)}</span>` : ""}</span>
      </button>
      ${item.optional ? `<button class="skip" data-skip="${item.id}" aria-pressed="${c && c.s === "na" ? "true" : "false"}">entfällt</button>` : ""}
    </li>`;
  }

  function roundsHtml(key, ctx) {
    const s = SHIFTS[key];
    const chips = s.rounds.map(h => {
      const id = roundId(key, h), c = state.checks[id];
      let cls = c ? "done" : "";
      if (!c && typeof ctx === "number") cls = ctx >= (h + 1) * 60 ? "late" : (ctx >= h * 60 ? "now" : "");
      if (!c && ctx === "past") cls = "late";
      const title = c ? whoLine(c).replace(/<[^>]+>/g, "") : `Rundgang ${h}:00–${h}:59`;
      return `<button class="chip ${cls}" data-id="${id}" aria-pressed="${!!c}" title="${esc(title)}">${pad(h)}:00</button>`;
    }).join("");
    return `<div class="rounds"><div class="label">Rundgang durch die Halle / <span>draußen</span> – 1× pro Stunde</div><div class="chips">${chips}</div></div>`;
  }

  function renderShift(key) {
    const s = SHIFTS[key], ctx = timeCtx();
    const phases = [...s.phases].sort((a, b) => (a.running === b.running ? toMin(a.from) - toMin(b.from) : a.running ? -1 : 1));
    // „Laufend" steht oben, weil es die ganze Schicht gilt.
    return `<div class="timeline">${phases.map(p => {
      const st = phaseState(p, state.checks, ctx);
      const pill = { now: '<span class="pill now">jetzt</span>', late: '<span class="pill late">offen</span>', done: '<span class="pill done">erledigt</span>', later: "" }[st];
      const when = p.running ? `${s.start}<small>bis ${s.end}</small>` : `${p.from}<small>bis ${p.to}</small>`;
      return `<section class="phase is-${st}">
        <div class="when">${when}</div>
        <div class="card">
          <div class="phead"><h2>${esc(p.title)}</h2>${p.hint ? `<span class="hint">${esc(p.hint)}</span>` : ""}${pill}</div>
          <ul class="items">${p.items.map(itemHtml).join("")}</ul>
          ${p.running ? roundsHtml(key, ctx) : ""}
        </div>
      </section>`;
    }).join("")}</div>`;
  }

  function renderMonth() {
    const d = parseIso(state.date), y = d.getFullYear(), m = d.getMonth();
    const days = new Date(y, m + 1, 0).getDate(), today = isoDate(new Date());
    const head = Array.from({ length: days }, (_, i) => `<th scope="col">${pad(i + 1)}.</th>`).join("");
    const row = (key) => Array.from({ length: days }, (_, i) => {
      const date = `${y}-${pad(m + 1)}-${pad(i + 1)}`;
      const checks = date === state.date ? state.checks : (state.month[date] || {});
      const p = progress(key, checks);
      const cls = date > today && !p.done ? "future" : p.pct === 100 ? "full" : p.done ? "part" : "none";
      const text = p.done ? (p.pct === 100 ? "✓" : p.pct + "%") : "·";
      return `<td><button class="mcell ${cls}${date === state.date ? " sel" : ""}" data-date="${date}" data-shift="${key}" aria-label="${SHIFTS[key].label} ${pad(i + 1)}.${pad(m + 1)}.: ${p.done} von ${p.total}">${text}</button></td>`;
    }).join("");
    return `<div class="monthhead">
        <button class="iconbtn" id="mprev" aria-label="Vorheriger Monat">‹</button>
        <h2>${MONTHS[m]} ${y}</h2>
        <button class="iconbtn" id="mnext" aria-label="Nächster Monat">›</button>
      </div>
      <div class="mscroll"><table class="mgrid">
        <thead><tr><th class="rowh"></th>${head}</tr></thead>
        <tbody><tr><th class="rowh" scope="row">Früh</th>${row("frueh")}</tr><tr><th class="rowh" scope="row">Spät</th>${row("spaet")}</tr></tbody>
      </table></div>
      <div class="legend"><span><i style="background:var(--done-soft);box-shadow:inset 0 0 0 1px var(--done)"></i>vollständig</span><span><i style="background:var(--now-soft);box-shadow:inset 0 0 0 1px var(--now)"></i>teilweise</span><span>Tippe auf einen Tag, um ihn zu öffnen.</span></div>`;
  }

  function render() {
    renderTabs();
    $("main").innerHTML = state.view === "monat" ? renderMonth() : renderShift(state.view);
  }

  // ---------- Interaktion ----------
  function goDate(date) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    state.date = date;
    subscribeMonth();
    subscribeDay();
  }
  function shiftDays(n) { const d = parseIso(state.date); d.setDate(d.getDate() + n); goDate(isoDate(d)); }
  function shiftMonths(n) { const d = parseIso(state.date); d.setDate(1); d.setMonth(d.getMonth() + n); goDate(isoDate(d)); }

  $("prev").addEventListener("click", () => shiftDays(-1));
  $("next").addEventListener("click", () => shiftDays(1));
  $("today").addEventListener("click", () => goDate(isoDate(new Date())));
  $("datepick").addEventListener("change", (e) => goDate(e.target.value));
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { state.view = t.dataset.view; render(); }));

  $("main").addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.id === "mprev") return shiftMonths(-1);
    if (t.id === "mnext") return shiftMonths(1);
    if (t.dataset.date) { state.view = t.dataset.shift; goDate(t.dataset.date); return; }
    const stamp = (s) => ({ s, by: myId || null, at: new Date().toISOString() });
    if (t.dataset.id) {
      const c = state.checks[t.dataset.id];
      setCheck(t.dataset.id, c && c.s === "done" ? null : stamp("done"));
    } else if (t.dataset.skip) {
      const c = state.checks[t.dataset.skip];
      setCheck(t.dataset.skip, c && c.s === "na" ? null : stamp("na"));
    }
  });

  // Zeitbezogene Markierungen jede Minute aktualisieren (nur Anzeige, kein Schreiben).
  setInterval(() => { if (state.view !== "monat") render(); }, 60000);

  // ---------- Start ----------
  render();
  (async () => {
    const api = window.claude && typeof window.claude.use === "function" ? window.claude : null;
    if (api) {
      try { db = await api.use("db"); } catch { db = null; }
      try { user = await api.use("user"); } catch { user = null; }
    }
    if (user) { try { myId = await user.id(); } catch { myId = null; } }
    state.mode = db ? "shared" : "local";
    if (user && typeof user.can === "function") {
      try { if ((await user.can("data.write")) === false) state.readOnly = true; } catch { /* unbekannt */ }
    }
    setStatus(state.readOnly ? "Nur Lesezugriff." : statusLine(), state.readOnly);
    subscribeMonth();
    subscribeDay();
  })();
})();
</script>
